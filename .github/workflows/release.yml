name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (must point at the checked-out commit)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      LLVM_VERSION: "20"
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate release tag
        run: |
          python3 -c 'import os; from tools.release import validate_tag; validate_tag(os.environ["RELEASE_TAG"])'
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make python3 wget unzip binutils lsb-release gnupg software-properties-common
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "clang-$LLVM_VERSION" "lld-$LLVM_VERSION" "llvm-$LLVM_VERSION"
          echo "LLVM_CONFIG=$(command -v llvm-config-$LLVM_VERSION)" >> "$GITHUB_ENV"
          echo "PS5_PAYLOAD_SDK=$HOME/ps5-payload-sdk" >> "$GITHUB_ENV"
      - name: Install pinned PS5 payload SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/download/v0.44/ps5-payload-sdk.zip -O /tmp/ps5-payload-sdk.zip
          echo "4d06eab777bb135705b5a6816688c9132efb246093fe606ac488ab6cf65ca5b0  /tmp/ps5-payload-sdk.zip" | sha256sum -c -
          unzip -q /tmp/ps5-payload-sdk.zip -d "$HOME"
      - name: Install pinned OpenOrbis PS4 toolchain
        # v0.5.4 toolchain-llvm-18: headers, link.x, the libraries and create-fself for the PS4 plugin.
        run: |
          wget -q https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz -O /tmp/openorbis-toolchain.tar.gz
          echo "3c7cd5bb593ca74fa1c13fd59f3938dc0fc07985167f7275063019e63abe4526  /tmp/openorbis-toolchain.tar.gz" | sha256sum -c -
          tar -xzf /tmp/openorbis-toolchain.tar.gz -C "$HOME"
          test -f "$HOME/OpenOrbis/PS4Toolchain/link.x"
          test -x "$HOME/OpenOrbis/PS4Toolchain/bin/linux/create-fself"
          echo "OO_PS4_TOOLCHAIN=$HOME/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"
      - name: Build and assemble release
        run: |
          make package-universal
          make ps4-plugin-release PS4_LLVM_BINDIR="/usr/lib/llvm-$LLVM_VERSION/bin"
          python3 tools/release.py assemble --tag "$RELEASE_TAG" --ps4-plugin
          python3 tools/release.py verify --tag "$RELEASE_TAG"
      - name: Retain release assets
        uses: actions/upload-artifact@v4
        with:
          name: GTAVMenu-${{ env.RELEASE_TAG }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14
