name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (must point at the checked-out commit)
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      LLVM_VERSION: "20"
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Validate release tag
        run: |
          python3 -c 'import os; from tools.release import validate_tag; validate_tag(os.environ["RELEASE_TAG"])'
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends make python3 wget unzip binutils lsb-release gnupg software-properties-common
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "clang-$LLVM_VERSION" "lld-$LLVM_VERSION" "llvm-$LLVM_VERSION"
          echo "LLVM_CONFIG=$(command -v llvm-config-$LLVM_VERSION)" >> "$GITHUB_ENV"
          echo "PS5_PAYLOAD_SDK=$HOME/ps5-payload-sdk" >> "$GITHUB_ENV"
      - name: Install pinned PS5 payload SDK
        run: |
          wget -q https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip -O /tmp/ps5-payload-sdk.zip
          echo "a9cc9929f21b2b2c5d5b309f3bab4997067c45281c0622cf4838b1aecba66fcb  /tmp/ps5-payload-sdk.zip" | sha256sum -c -
          unzip -q /tmp/ps5-payload-sdk.zip -d "$HOME"
      - name: Build and assemble release
        run: |
          for target in ppsa04264-01.005.000 ppsa04264-01.010.002 ppsa04263-01.010.002; do
            make GTAV_TARGET="$target" package-target
          done
          python3 tools/release.py assemble --tag "$RELEASE_TAG"
          python3 tools/release.py verify --tag "$RELEASE_TAG"
      - name: Retain release assets
        uses: actions/upload-artifact@v4
        with:
          name: GTAVMenu-${{ env.RELEASE_TAG }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/release.py publish --platform github --tag "$RELEASE_TAG"
